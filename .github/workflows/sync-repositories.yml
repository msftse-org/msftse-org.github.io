name: Sync repository catalog

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Discover repositories and update catalog PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UPDATE_BRANCH: automation/repository-catalog

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Run catalog unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Find prior generated metadata
        shell: bash
        run: |
          prior_catalog="$RUNNER_TEMP/prior-repositories.json"
          if git fetch origin "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" && \
             git show "origin/$UPDATE_BRANCH:data/repositories.json" > "$prior_catalog"; then
            echo "CATALOG_PREVIOUS=$prior_catalog" >> "$GITHUB_ENV"
          else
            echo "CATALOG_PREVIOUS=data/repositories.json" >> "$GITHUB_ENV"
          fi

      - name: Build catalog from the GitHub organization
        env:
          CATALOG_GITHUB_TOKEN: ${{ secrets.ORG_REPOSITORY_TOKEN || github.token }}
          CATALOG_LLM_ENDPOINT: ${{ secrets.CATALOG_LLM_ENDPOINT }}
          CATALOG_LLM_API_KEY: ${{ secrets.CATALOG_LLM_API_KEY }}
          CATALOG_LLM_MODEL: ${{ secrets.CATALOG_LLM_MODEL }}
          CATALOG_LLM_AUTH_STYLE: ${{ secrets.CATALOG_LLM_AUTH_STYLE }}
        run: python3 scripts/sync_repositories.py --previous "$CATALOG_PREVIOUS"

      - name: Detect catalog changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/repositories.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Repository catalog is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the catalog pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: |
            This automated PR refreshes the landing-page repository catalog from the GitHub organization.

            New, non-curated repositories are analyzed from their tree, documentation, manifests, and entry points when LLM secrets are configured. Classification precedence is: manual override, prior LLM enrichment, repository topic, name/description keyword, then the configured fallback.

            Please review AI-generated descriptions, tags, and classifications before merging.

            Generated by the scheduled repository catalog workflow.
        shell: bash
        run: |
          set -euo pipefail

          generated_catalog="$RUNNER_TEMP/repositories.json"
          existing_catalog="$RUNNER_TEMP/existing-repositories.json"
          cp data/repositories.json "$generated_catalog"
          git restore --staged --worktree data/repositories.json

          git fetch origin "$BASE_BRANCH"
          remote_branch_exists=false
          if git fetch origin "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"; then
            remote_branch_exists=true
          fi

          open_pr_number="$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ "$remote_branch_exists" == "true" ]]; then
            base_sha="$(git rev-parse "origin/$BASE_BRANCH")"
            merge_base="$(git merge-base "origin/$BASE_BRANCH" "origin/$UPDATE_BRANCH" || true)"
            git show "origin/$UPDATE_BRANCH:data/repositories.json" > "$existing_catalog" || true
            if cmp -s "$generated_catalog" "$existing_catalog" && [[ "$merge_base" == "$base_sha" ]] && [[ -n "$open_pr_number" ]]; then
              echo "The open catalog PR already contains this generated catalog."
              exit 0
            fi
          fi

          git checkout -B "$UPDATE_BRANCH" "origin/$BASE_BRANCH"
          cp "$generated_catalog" data/repositories.json
          git add data/repositories.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync repository catalog"
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

          if [[ -z "$open_pr_number" ]]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "chore: sync repository catalog" \
              --body "$PR_BODY"
          else
            echo "Updated catalog PR #$open_pr_number."
          fi
